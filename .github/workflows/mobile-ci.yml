name: Validar aplicaciones móviles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: Validar relay y fixtures compartidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: relay/pyproject.toml
      - run: python -m pip install -e ".[test]"
        working-directory: relay
      - run: python -m pytest
        working-directory: relay
      - run: python tests/conformance/generate_firmware_header.py --check

  flutter:
    name: Analizar y probar Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  android:
    name: Compilar Android
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: flutter pub get
        working-directory: app
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: app/android
      - run: ./gradlew :relay:test :relay:assembleTvDebug :relay:assembleAutomotiveDebug
        working-directory: app/android
      - run: flutter build apk --release
        working-directory: app

  ios:
    name: Compilar iOS sin firma
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: pod install
        working-directory: app/ios
      - name: Ejecutar RunnerTests y conformidad Swift
        working-directory: app/ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))' )"
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - run: flutter build ios --release --no-codesign
        working-directory: app

  security:
    name: SBOM y dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Revisar cambios de dependencias
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Generar SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: hearthbit-sbom.cdx.json
      - name: Escanear dependencias y archivos
        # Anclado por SHA: los tags < 0.35.0 fueron comprometidos y eliminados
        # (incidente de cadena de suministro de trivy-action, 2026-03-19).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Con formato SARIF el action ignora `severity` salvo que se active esto;
          # sin ello, exit-code falla ante cualquier hallazgo, incluso LOW.
          limit-severities-for-sarif: true
          # Solo compilamos las fuentes Noise (noise/southernstorm) de ese submódulo;
          # sus gradle.lockfile traen dependencias (netty, bouncycastle) que nunca
          # se construyen ni se distribuyen con esta app.
          skip-dirs: vendor/bitchat-android
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
