[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthbit-relay"
version = "0.1.0"
description = "Linux/BlueZ relay for the HearthBit binary mesh"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=46,<51",
    "dbus-fast>=5.0.22,<6",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
hearthbit-relay = "hearthbit_relay.main:main"
hearthbit-relay-trust = "hearthbit_relay.trust:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
